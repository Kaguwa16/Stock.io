<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Stock Monitoring Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl">
        <!-- Header / Logo Title -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight text-white">Stock Monitoring</h1>
            <p class="text-sm text-slate-400 mt-1">Silakan masuk ke akun Anda</p>
        </div>

        <!-- Pesan Error (Hidden secara default) -->
        <div id="errorMessage" class="hidden mb-4 p-3 bg-red-950/50 border border-red-800/60 text-red-300 text-sm rounded-lg text-center">
        </div>

        <!-- Form Login -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    required 
                    placeholder="nama@email.com"
                    class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm text-white placeholder-slate-600 transition"
                >
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Kata Sandi</label>
                <input 
                    type="password" 
                    id="password" 
                    required 
                    placeholder="••••••••"
                    class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm text-white placeholder-slate-600 transition"
                >
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition duration-200 shadow-lg shadow-indigo-600/20 text-sm cursor-pointer"
            >
                Masuk ke Dashboard
            </button>
        </form>

        <!-- Catatan Tambahan -->
        <div class="mt-6 text-center text-xs text-slate-500">
            Sistem Manajemen Inventaris & Log Keuangan &copy; 2026
        </div>
    </div>

    <!-- Skrip Firebase & Logika Login (Modular SDK v11) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Konfigurasi Firebase Anda (Sesuaikan dengan project Firebase Anda)
        const firebaseConfig = {
          apiKey: "AIzaSyCpkSNCxVKr7pQz6mKZKqlJGz4-k6pMCMQ",
          authDomain: "monitor-stock-1dab6.firebaseapp.com",
          projectId: "monitor-stock-1dab6",
          storageBucket: "monitor-stock-1dab6.firebasestorage.app",
          messagingSenderId: "28635188865",
        appId: "1:28635188865:web:3921fbe9c21f4c4d0bc780",
        measurementId: "G-KE8B9FG4H8"
        };


        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Jika user sudah terautentikasi, langsung arahkan ke index.html
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "index.html";
            }
        });

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.add('hidden');
            submitBtn.textContent = 'Memproses...';
            submitBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Berhasil login, onAuthStateChanged akan otomatis mengalihkan ke index.html
            } catch (error) {
                errorMessage.textContent = getFriendlyErrorMessage(error.code);
                errorMessage.classList.remove('hidden');
                submitBtn.textContent = 'Masuk ke Dashboard';
                submitBtn.disabled = false;
            }
        });

        // Penerjemah pesan error Firebase agar lebih ramah pengguna
        function getFriendlyErrorMessage(errorCode) {
            switch (errorCode) {
                case 'auth/invalid-email':
                    return 'Format alamat email tidak valid.';
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    return 'Email atau kata sandi yang Anda masukkan salah.';
                case 'auth/too-many-requests':
                    return 'Terlalu banyak percobaan gagal. Akun dibatasi sementara, coba lagi nanti.';
                default:
                    return 'Gagal masuk: ' + errorCode;
            }
        }
    </script>
</body>
</html>
